[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docanswer"
version = "0.1.0"
description = "Internal knowledge assistant: answers from company documents with verified citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pypdf>=4.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docanswer = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]
