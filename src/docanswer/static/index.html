<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocAnswer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2230; --muted:#5d6678; --line:#e2e5ea; --accent:#2457d6; --warn:#a15c00; --warn-bg:#fff4e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --ink:#e7e9ee; --muted:#9aa3b4; --line:#2b313c; --accent:#7aa2ff; --warn:#ffc46b; --warn-bg:#2d2414; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; }
  select, button { padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 24px; }
  .chip { font-size:.85rem; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; }
  .answer { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; white-space:pre-wrap; }
  .answer.refused { background:var(--warn-bg); color:var(--warn); }
  .meta { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.85rem; margin:10px 0 18px; }
  .bar { width:120px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--accent); }
  .cards { display:grid; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:12px 14px; }
  .card b { display:block; margin-bottom:4px; }
  .card p { margin:0; color:var(--muted); font-size:.9rem; }
  footer { margin-top:40px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>DocAnswer</h1>
  <p class="sub">Answers from Kestrel Ridge Logistics' (fictional) policies, with page citations. If it is not in the documents, it says so.</p>
  <form id="ask">
    <input id="q" type="text" placeholder="e.g. What is the hotel limit in Bogota?" autocomplete="off" required minlength="3">
    <select id="role" aria-label="Role">
      <option value="guest">Guest</option>
      <option value="employee" selected>Employee</option>
      <option value="manager">Manager</option>
    </select>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="chips" id="chips"></div>
  <section id="out" aria-live="polite"></section>
  <footer>Demo on a synthetic corpus. Role is chosen here for demonstration; in production it comes from SSO.</footer>
</main>
<script>
const samples = [
  "What is the nightly hotel limit in Bogota?",
  "How many remote days per week are allowed?",
  "¿Cuántos días de vacaciones tengo por año?",
  "What is the merit increase budget for 2026?",
  "Does the company offer a stock option plan?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
for (const s of samples) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = s;
  b.onclick = () => { $("q").value = s; $("ask").requestSubmit(); };
  $("chips").appendChild(b);
}
$("ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  try {
    const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: $("q").value, role: $("role").value }) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const pct = Math.round(data.confidence * 100);
    $("out").innerHTML = `
      <div class="answer ${data.refused ? "refused" : ""}">${esc(data.answer)}</div>
      <div class="meta">Retrieval confidence <div class="bar"><span style="width:${pct}%"></span></div> ${pct}%</div>
      <div class="cards">${data.citations.map((c) => `
        <div class="card"><b>${esc(c.doc)} · page ${c.page}</b><p>${esc(c.snippet)}</p></div>`).join("")}</div>`;
  } catch (err) {
    $("out").innerHTML = `<div class="answer refused">Request failed: ${esc(String(err))}</div>`;
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
